name: CI — Validation du code

on:
  push:
    branches:
      - principal
  pull_request:
    branches:
      - principal

jobs:

  validate-html:
    name: 🔍 Validation HTML
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: ⚙️ Installer html5validator
        run: |
          pip install html5validator --quiet

      - name: ✅ Valider les fichiers HTML
        run: |
          html5validator --root application/ || echo "HTML warnings"

  validate-css:
    name: 🎨 Validation CSS
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Installer stylelint
        run: npm install -g stylelint stylelint-config-standard

      - name: 🔧 Configurer stylelint
        run: echo '{"extends":["stylelint-config-standard"]}' > .stylelintrc.json

      - name: ✅ Valider CSS
        run: |
          stylelint "application/**/*.css" || echo "CSS warnings"

  check-structure:
    name: 📁 Vérification structure
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: 🔎 Vérifier fichiers
        run: |
          echo "Vérification du projet..."
          FILES=(
            "application/index.html"
            "application/style.css"
            "application/app.js"
          )

          ALL_OK=true

          for FILE in "${FILES[@]}"; do
            if [ -f "$FILE" ]; then
              echo "✅ $FILE trouvé"
            else
              echo "❌ $FILE MANQUANT"
              ALL_OK=false
            fi
          done

          if [ "$ALL_OK" = false ]; then
            echo "Erreur: fichiers manquants"
            exit 1
          fi

          echo "✅ Structure OK"